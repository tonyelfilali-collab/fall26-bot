name: Credit check

# Manual only. Asks OpenRouter how much credit the OPENROUTER_API_KEY has.
# Free: it reads the key's info and runs no model.
on:
  workflow_dispatch:
    inputs:
      gemini_test_models:
        description: "Gemini models to send one tiny test call each (space-separated; uses 1 of each model's daily quota)"
        type: string
        default: "gemini-3.6-flash"
      gemini_grounding:
        description: "Make the test calls with Grounding with Google Search"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  credit_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask OpenRouter for this key's limit and usage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          status=$(curl -sS -o key.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/key)
          if [ "$status" != "200" ]; then
            echo "OpenRouter answered HTTP $status"
            exit 1
          fi
          # Only these numbers are printed: never the key or its label.
          jq -r '.data |
            "| Limit (USD) | \(if .limit == null then "no limit" else .limit end) |",
            "| Used (USD) | \(.usage) |",
            "| Remaining (USD) | \(if .limit_remaining == null then "no limit" else .limit_remaining end) |",
            "| Free tier key | \(.is_free_tier) |"' key.json > table.md
          rm key.json
          {
            echo "## OpenRouter credit"
            echo ""
            echo "| | |"
            echo "|---|---|"
            cat table.md
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Plan B: the free Google AI Studio key. Lists the Gemini models it can
      # use and makes one tiny test call (free tier, no billing), reporting
      # whether it worked, the thinking tokens used, and any quota error.
      - name: Check the free Gemini key
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEST_MODELS: ${{ inputs.gemini_test_models || 'gemini-3.6-flash' }}
          GEMINI_GROUNDING: ${{ inputs.gemini_grounding }}
        run: |
          set -uo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api=https://generativelanguage.googleapis.com/v1beta
          status=$(curl -sS -o models.json -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" "$api/models?pageSize=1000")
          {
            echo "## Gemini key"
            echo ""
            echo "Model list: HTTP $status"
            echo ""
            echo "Gemini models that can generate text:"
            echo ""
            jq -r '.models[]? | select(.name | test("gemini")) |
              select(.supportedGenerationMethods | index("generateContent")) |
              "- `\(.name | ltrimstr("models/"))`\(if .thinking then " (thinking)" else "" end)"' models.json
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f models.json

          body='{"contents":[{"parts":[{"text":"Reply with the single word OK."}]}]}'
          if [ "$GEMINI_GROUNDING" = "true" ]; then
            body='{"contents":[{"parts":[{"text":"Using Google Search, name one news headline from today in one short line."}]}],
                   "tools":[{"google_search":{}}]}'
          fi
          for model in $GEMINI_TEST_MODELS; do
            status=$(curl -sS -o reply.json -w '%{http_code}' \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              -d "$body" "$api/models/$model:generateContent")
            {
              echo ""
              echo "One test call to \`$model\`: HTTP $status"
              echo ""
              jq -r '
                if .usageMetadata then
                  "- Tokens: prompt \(.usageMetadata.promptTokenCount), answer \(.usageMetadata.candidatesTokenCount // 0), thinking \(.usageMetadata.thoughtsTokenCount // 0)"
                else empty end,
                if .candidates[0].groundingMetadata then
                  "- Grounded: \(.candidates[0].groundingMetadata.webSearchQueries // [] | length) search(es), \(.candidates[0].groundingMetadata.groundingChunks // [] | length) source(s)"
                else empty end,
                if .error then
                  "- Error: \(.error.status): \(.error.message | .[0:300])",
                  (.error.details[]? | .violations[]? |
                    "- Quota: \(.quotaMetric // "") \(.quotaId // "") limit \(.quotaValue // "?")"),
                  (.error.details[]? | select(.violations == null) |
                    "- Detail: \(tojson | .[0:300])")
                else empty end' reply.json
            } | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f reply.json
          done
