name: Test Bot

# Manual only. Forecasts on the bot-testing-area (not real questions), so it
# does not need BOT_ENABLED.
on:
  workflow_dispatch:
    inputs:
      lineup:
        description: "Model lineup. 'free' (default): real free models. 'replay': recorded replies, 0 model calls (the Tier B gate). 'replay-credits': credits rehearsal, 0 model calls. 'real-regression': free model on the 37 regression-pack questions, never submitted."
        type: choice
        options: [free, replay, replay-credits, real-regression, gemini-free]
        default: free
      break_on_purpose:
        description: "Make every question fail, to check a failed run shows red"
        type: boolean
        default: false
      one_binary:
        description: "Forecast only one binary question (saves free quota)"
        type: boolean
        default: false
      fail_planned_forecasts:
        description: "Make every planned forecast fail, to check the quick forecast still submits"
        type: boolean
        default: false
      only_model:
        description: "Forecast with only this Gemini model, e.g. gemini/gemini-3.8-flash (blank = normal plan)"
        type: string
        default: ""
      free_model:
        description: "Free lineup only: another OpenRouter ':free' model id (blank = the default free model)"
        type: string
        default: ""
      runaway:
        description: "replay-credits only: every model times out; each question must stay under its spend cap"
        type: boolean
        default: false
      retry_run:
        description: "replay-credits only: pass 1's submission fails, pass 2 must reuse the finished forecasts (nothing bought twice)"
        type: boolean
        default: false
      fail_model:
        description: "replay-credits only: this model fails every call, so its backup runs (e.g. openrouter/anthropic/claude-opus-5.5)"
        type: string
        default: ""

# Lineups that call Gemini with the live key (gemini-free) share the group of
# every workflow that uses it, one at a time. The others (replay, replay-credits,
# replay-gemini, free, real-regression: no Gemini key) have their own group,
# so a test can never cancel a waiting live run (GitHub keeps only one waiting
# run per group and cancels the older one).
concurrency:
  group: ${{ inputs.lineup == 'gemini-free' && 'forecast-bot' || 'test-bot-no-gemini' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          if [ "$LINEUP" = "real-regression" ]; then
            args=(--mode test_questions --lineup free --real-regression)
          else
            args=(--mode test_questions --lineup "${LINEUP:-free}")
          fi
          if [ "$BREAK_ON_PURPOSE" = "true" ]; then args+=(--break-on-purpose); fi
          if [ "$ONE_BINARY" = "true" ]; then args+=(--one-binary); fi
          if [ "$FAIL_PLANNED" = "true" ]; then args+=(--fail-planned-forecasts); fi
          if [ -n "$ONLY_MODEL" ]; then args+=(--only-model "$ONLY_MODEL"); fi
          if [ -n "$FAIL_MODEL" ]; then args+=(--fail-model "$FAIL_MODEL"); fi
          if [ "$RUNAWAY" = "true" ]; then args+=(--runaway); fi
          if [ "$RETRY_RUN" = "true" ]; then args+=(--retry-run); fi
          if [ -n "$FREE_MODEL" ]; then args+=(--free-model "openrouter/${FREE_MODEL#openrouter/}"); fi
          poetry run python main.py "${args[@]}"
        env:
          LINEUP: ${{ inputs.lineup }}
          BREAK_ON_PURPOSE: ${{ inputs.break_on_purpose }}
          ONE_BINARY: ${{ inputs.one_binary }}
          FAIL_PLANNED: ${{ inputs.fail_planned_forecasts }}
          ONLY_MODEL: ${{ inputs.only_model }}
          FAIL_MODEL: ${{ inputs.fail_model }}
          RUNAWAY: ${{ inputs.runaway }}
          RETRY_RUN: ${{ inputs.retry_run }}
          FREE_MODEL: ${{ inputs.free_model }}
          # Only the secrets the bot uses (see NOTES.md). No paid services.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Official data for numeric questions (hard_data.py; FRED is free).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Free Google AI Studio key (no billing), for the gemini-free lineup.
          # Only the gemini-free lineup gets it (that lineup stays in the shared group).
          GEMINI_API_KEY: ${{ inputs.lineup == 'gemini-free' && secrets.GEMINI_API_KEY || '' }}
          # Writes the Gemini daily quota ledger to the private fall26-data repo.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
