name: Test Bot

# Manual only. Forecasts on the bot-testing-area (not real questions), so it
# does not need BOT_ENABLED.
on:
  workflow_dispatch:
    inputs:
      break_on_purpose:
        description: "Make every question fail, to check a failed run shows red"
        type: boolean
        default: false

# Shared with every workflow that forecasts, so they never run at the same time.
concurrency:
  group: forecast-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          if [ "$BREAK_ON_PURPOSE" = "true" ]; then
            poetry run python main.py --mode test_questions --break-on-purpose
          else
            poetry run python main.py --mode test_questions
          fi
        env:
          BREAK_ON_PURPOSE: ${{ inputs.break_on_purpose }}
          # Only the secrets the bot uses (see NOTES.md). No paid services.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
