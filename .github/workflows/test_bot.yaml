name: Test Bot

# Manual only. Forecasts on the bot-testing-area (not real questions), so it
# does not need BOT_ENABLED.
on:
  workflow_dispatch:
    inputs:
      lineup:
        description: "Model lineup. 'free' (default): real free models. 'replay': recorded replies, 0 model calls (the Tier B gate). 'replay-credits': credits rehearsal, 0 model calls. 'real-regression': free model on the 37 regression-pack questions, never submitted. 'replay-gemini': the gemini-free pool and backup chain with recorded replies, 0 model calls. 'burst-rehearsal': 3 simulated days of MiniBench bursts, 0 model calls. 'timing-rehearsal': run time limits on a virtual clock (burst of 5 at every limit; overload of 12), 0 model calls. 'paid-flash-rehearsal': the paid-Flash fallback (switched on for the rehearsal only) with every free Flash 503, caps and Nemotron backup, 0 model calls."
        type: choice
        options: [free, replay, replay-credits, replay-gemini, burst-rehearsal, timing-rehearsal, paid-flash-rehearsal, real-regression, gemini-free]
        default: free
      break_on_purpose:
        description: "Make every question fail, to check a failed run shows red"
        type: boolean
        default: false
      one_binary:
        description: "Forecast only one binary question (saves free quota)"
        type: boolean
        default: false
      fail_planned_forecasts:
        description: "Make every planned forecast fail, to check the quick forecast still submits"
        type: boolean
        default: false
      only_model:
        description: "Forecast with only this Gemini model, e.g. gemini/gemini-3.8-flash (blank = normal plan)"
        type: string
        default: ""
      free_model:
        description: "Free lineup only: another OpenRouter ':free' model id (blank = the default free model)"
        type: string
        default: ""
      exhaust_flash:
        description: "replay-gemini only: every Flash model used up, Flash-Lite at its reserve (the Nemotron backup must answer)"
        type: boolean
        default: false
      rehearsal:
        description: "replay-credits only, spend-guard rehearsal: runaway (every model times out, caps hold), retry-run (nothing bought twice), unknown-cost (charged the estimate, hits caps, alert), missing-ledger (Lean + alert), key-mismatch (Lean + alert)"
        type: choice
        options: [none, runaway, retry-run, unknown-cost, missing-ledger, key-mismatch]
        default: none
      fail_model:
        description: "replay-credits only: this model fails every call, so its backup runs (e.g. openrouter/anthropic/claude-opus-5.5)"
        type: string
        default: ""

# Lineups that call Gemini with the live key (gemini-free) share the group of
# every workflow that uses it, one at a time. The others (replay, replay-credits,
# replay-gemini, burst/timing rehearsals, free, real-regression: no Gemini key) have their own group,
# so a test can never cancel a waiting live run (GitHub keeps only one waiting
# run per group and cancels the older one).
concurrency:
  group: ${{ inputs.lineup == 'gemini-free' && 'forecast-bot' || 'test-bot-no-gemini' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"
      # Install fix (architect, 1 Oct): Poetry and the project's .venv are
      # cached between runs (key: exact Python version + lock file), so on a
      # cache hit no package is downloaded and a PyPI outage can't stop the run.
      - name: Restore Poetry (cache)
        id: poetry-cache
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-v1
      - name: Install poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Use the cached Poetry
        if: steps.poetry-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true
          echo "Poetry: cache hit (install skipped)"
      - name: Restore dependencies (cache)
        id: venv-cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          # Cache miss: up to 3 tries, 20 s apart (PyPI timeouts, 1 Oct).
          for attempt in 1 2 3; do
            poetry install --no-interaction --no-root && exit 0
            echo "Install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Dependencies from cache
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          echo "Dependencies: cache hit (install skipped)"
      - name: Run bot
        run: |
          if [ "$LINEUP" = "burst-rehearsal" ]; then
            poetry run python burst_rehearsal.py
            exit $?
          fi
          if [ "$LINEUP" = "timing-rehearsal" ]; then
            poetry run python timing_rehearsal.py
            exit $?
          fi
          if [ "$LINEUP" = "paid-flash-rehearsal" ]; then
            poetry run python paid_flash_rehearsal.py
            exit $?
          fi
          if [ "$LINEUP" = "real-regression" ]; then
            args=(--mode test_questions --lineup free --real-regression)
          else
            args=(--mode test_questions --lineup "${LINEUP:-free}")
          fi
          if [ "$BREAK_ON_PURPOSE" = "true" ]; then args+=(--break-on-purpose); fi
          if [ "$ONE_BINARY" = "true" ]; then args+=(--one-binary); fi
          if [ "$FAIL_PLANNED" = "true" ]; then args+=(--fail-planned-forecasts); fi
          if [ -n "$ONLY_MODEL" ]; then args+=(--only-model "$ONLY_MODEL"); fi
          if [ -n "$FAIL_MODEL" ]; then args+=(--fail-model "$FAIL_MODEL"); fi
          if [ "$EXHAUST_FLASH" = "true" ]; then args+=(--exhaust-flash); fi
          if [ -n "$REHEARSAL" ] && [ "$REHEARSAL" != "none" ]; then args+=(--rehearsal "$REHEARSAL"); fi
          if [ -n "$FREE_MODEL" ]; then args+=(--free-model "openrouter/${FREE_MODEL#openrouter/}"); fi
          poetry run python main.py "${args[@]}"
        env:
          LINEUP: ${{ inputs.lineup }}
          BREAK_ON_PURPOSE: ${{ inputs.break_on_purpose }}
          ONE_BINARY: ${{ inputs.one_binary }}
          FAIL_PLANNED: ${{ inputs.fail_planned_forecasts }}
          ONLY_MODEL: ${{ inputs.only_model }}
          FAIL_MODEL: ${{ inputs.fail_model }}
          EXHAUST_FLASH: ${{ inputs.exhaust_flash }}
          REHEARSAL: ${{ inputs.rehearsal }}
          FREE_MODEL: ${{ inputs.free_model }}
          # Only the secrets the bot uses (see NOTES.md). No paid services.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Official data for numeric questions (hard_data.py; FRED is free).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Free Google AI Studio key (no billing), for the gemini-free lineup.
          # Only the gemini-free lineup gets it (that lineup stays in the shared group).
          GEMINI_API_KEY: ${{ inputs.lineup == 'gemini-free' && secrets.GEMINI_API_KEY || '' }}
          # Writes the Gemini daily quota ledger to the private fall26-data repo.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
