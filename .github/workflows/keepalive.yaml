name: Keepalive

# GitHub pauses scheduled workflows in a public repo after 60 days with no
# commits. This makes one empty commit a week so the schedules never switch
# off. It forecasts nothing and spends nothing.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: keep scheduled workflows active"
          git push
