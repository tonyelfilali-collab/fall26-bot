name: Tournament info

# Manual only. Read-only: shows our target tournaments' ids, slugs and dates,
# and when their open questions open and close. Forecasts nothing, spends nothing.
on:
  workflow_dispatch:
    inputs:
      audit:
        description: "List every question of each tournament (any state) and whether we forecast it"
        type: boolean
        default: false
      standing:
        description: "Our bot's username, and its rank, score and 95% range on each leaderboard"
        type: boolean
        default: false
      standing_ids:
        description: "With standing: more tournament ids to check, comma-separated (e.g. an earlier MiniBench round)"
        type: string
        default: ""
      extra_tournaments:
        description: "Other tournaments (slugs or ids, comma-separated, e.g. market-pulse-26q4): facts, leaderboard size, post count by kind"
        type: string
        default: ""
      check_comment:
        description: "A post id: yes/no only, our private comment exists and its Final Prediction = our submitted forecast (binary)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tournament_info:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Show tournament info
        run: |
          args=()
          if [ "$AUDIT" = "true" ]; then args+=(--audit); fi
          if [ "$STANDING" = "true" ]; then args+=(--standing); fi
          poetry run python tournament_info.py "${args[@]}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          AUDIT: ${{ inputs.audit }}
          STANDING: ${{ inputs.standing }}
          STANDING_IDS: ${{ inputs.standing_ids }}
          EXTRA_TOURNAMENTS: ${{ inputs.extra_tournaments }}
          CHECK_COMMENT: ${{ inputs.check_comment }}
