name: Test bench

# PLAN.md Step 5. Manual only. Never publishes: forecasts open main-site
# questions and scores them against the community prediction (bench.py).
# Research is frozen and results are cached in fall26-data, so a run that
# stops (e.g. at the OpenRouter free limit) resumes where it left off.
# Configs: "free" (OpenRouter :free) or "credits" (only once credits exist).
# Never the live Gemini quota.
on:
  workflow_dispatch:
    inputs:
      size:
        description: "mini = 10 questions, quick = 30, full = 60"
        type: choice
        options: [mini, quick, full]
        default: mini
      config_a:
        description: "Config A"
        type: choice
        options: [free, credits]
        default: free
      label_a:
        description: "Label for config A's results (a new label = a fresh run)"
        type: string
        default: free-1
      config_b:
        description: "Config B (none = report A only)"
        type: choice
        options: [none, free, credits]
        default: none
      label_b:
        description: "Label for config B's results"
        type: string
        default: free-2

# Its own group: a long bench run must never hold up the live bot's runs
# (they use different models: free OpenRouter here, Gemini live).
concurrency:
  group: test-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run the test bench
        run: |
          args=(--size "$SIZE" --config-a "$CONFIG_A" --label-a "$LABEL_A")
          if [ "$CONFIG_B" != "none" ]; then args+=(--config-b "$CONFIG_B" --label-b "$LABEL_B"); fi
          poetry run python bench.py "${args[@]}"
        env:
          SIZE: ${{ inputs.size }}
          CONFIG_A: ${{ inputs.config_a }}
          LABEL_A: ${{ inputs.label_a }}
          CONFIG_B: ${{ inputs.config_b }}
          LABEL_B: ${{ inputs.label_b }}
          # Tony's read-only token, ONLY here, to read community predictions
          # (the bot account can't see them). The bot itself never gets it.
          METACULUS_READ_TOKEN: ${{ secrets.METACULUS_READ_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
