name: Daily health check

# Runs at 07:00 UK time and fails (red, so GitHub emails Tony) if a question is
# about to be missed, the bot hasn't run successfully for 3 hours, or Gemini
# quota is low. See health_check.py. Read-only: forecasts nothing, spends
# nothing (one AskNews search to see if it still returns 402).
on:
  schedule:
    - cron: "0 6 * * *" # 07:00 UK in summer time (BST)
    - cron: "0 7 * * *" # 07:00 UK in winter time (GMT)
  workflow_dispatch:
    inputs:
      simulate_miss:
        description: "Pretend a question is about to be missed (to check the alarm goes red)"
        type: boolean
        default: false
  # On a pull request that changes the health check, run it with a simulated
  # miss: that run is expected to be red, proving the alarm works.
  pull_request:
    paths:
      - health_check.py
      - .github/workflows/health.yml

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"
      # Install fix (architect, 1 Oct): Poetry and the project's .venv are
      # cached between runs (key: exact Python version + lock file), so on a
      # cache hit no package is downloaded and a PyPI outage can't stop the run.
      - name: Restore Poetry (cache)
        id: poetry-cache
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-v1
      - name: Install poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Use the cached Poetry
        if: steps.poetry-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true
          echo "Poetry: cache hit (install skipped)"
      - name: Restore dependencies (cache)
        id: venv-cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          # Cache miss: up to 3 tries, 20 s apart (PyPI timeouts, 1 Oct).
          for attempt in 1 2 3; do
            poetry install --no-interaction --no-root && exit 0
            echo "Install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Dependencies from cache
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          echo "Dependencies: cache hit (install skipped)"
      - name: Health check
        run: |
          args=()
          if [ "$EVENT" = "schedule" ]; then args+=(--cron "$CRON"); fi
          if [ "$SIMULATE_MISS" = "true" ] || [ "$EVENT" = "pull_request" ]; then
            args+=(--simulate-miss)
          fi
          poetry run python health_check.py "${args[@]}"
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SIMULATE_MISS: ${{ inputs.simulate_miss }}
          GITHUB_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
