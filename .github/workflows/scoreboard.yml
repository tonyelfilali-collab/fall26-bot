name: Scoreboard

# Scores every resolved tournament question logged in fall26-data: our live
# log score per question type, and the shadow variants (binary). Read-only:
# forecasts nothing, spends nothing. Weekly, plus a manual button.
# Manual option "calibration": instead, the calibration report (calibration.py),
# saved only to fall26-data reports/ (the job log shows the path and count only).
# Daily 06:45 UTC (architect, 29 Oct): report_schedule.py decides whether both
# the Scoreboard and the calibration report run today (Sat 7 Nov, Tue 10 Nov, or
# once 15+ agent-era questions have resolved); otherwise the job stops there.
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
    - cron: "45 6 * * *" # daily 06:45 UTC: the report schedule check
  workflow_dispatch:
    inputs:
      calibration:
        description: "Calibration report instead of the Scoreboard (saved to fall26-data reports/ only)"
        type: boolean
        default: false
      schedule_check:
        description: "Only the daily report schedule check (and both tables if it says so), as at 06:45 UTC"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scoreboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Report schedule check
        id: schedule
        if: ${{ github.event.schedule == '45 6 * * *' || inputs.schedule_check == true }}
        run: poetry run python report_schedule.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Score resolved questions
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.calibration != true && inputs.schedule_check != true) || github.event.schedule == '30 6 * * 1' || steps.schedule.outputs.run == 'true' }}
        run: poetry run python scoreboard.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Calibration report
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.calibration == true && inputs.schedule_check != true) || steps.schedule.outputs.run == 'true' }}
        run: poetry run python calibration.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Note the 15+ agent-era run
        if: ${{ steps.schedule.outputs.mark == 'true' }}
        run: poetry run python report_schedule.py --mark
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
