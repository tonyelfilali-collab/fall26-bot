name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Two schedules, every 10 minutes between them, offset off the hour.
    # Already-forecasted questions are skipped.
    - cron: "7,27,47 * * * *"
    - cron: "17,37,57 * * * *"

# One group shared by every workflow that forecasts, so they never run at
# the same time. A new run waits for the current one instead of cancelling it.
concurrency:
  group: forecast-bot
  cancel-in-progress: false

permissions:
  contents: read
  # Step 6: a spending-tier change opens an issue (GitHub emails Tony).
  issues: write
  # Starts health.yml once a day (health_dispatch.py).
  actions: write

jobs:
  forecast_job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Master switch: the repository variable BOT_ENABLED must be 'true'.
      # Emergency stop = set it to anything else.
      - name: Check BOT_ENABLED
        id: gate
        env:
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
        run: |
          if [ "$BOT_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "BOT_ENABLED is not true, exiting"
            echo "BOT_ENABLED is not true, exiting" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.11"
      # Install fix (architect, 1 Oct): Poetry and the project's .venv are
      # cached between runs (key: exact Python version + lock file), so on a
      # cache hit no package is downloaded and a PyPI outage can't stop the run.
      - name: Restore Poetry (cache)
        id: poetry-cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-v1
      - name: Install poetry
        if: steps.gate.outputs.enabled == 'true' && steps.poetry-cache.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Use the cached Poetry
        if: steps.gate.outputs.enabled == 'true' && steps.poetry-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true
          echo "Poetry: cache hit (install skipped)"
      - name: Restore dependencies (cache)
        id: venv-cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          # Cache miss: up to 3 tries, 20 s apart (PyPI timeouts, 1 Oct).
          for attempt in 1 2 3; do
            poetry install --no-interaction --no-root && exit 0
            echo "Install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Dependencies from cache
        if: steps.gate.outputs.enabled == 'true' && steps.venv-cache.outputs.cache-hit == 'true'
        run: |
          echo "Dependencies: cache hit (install skipped)"
      - name: Run bot
        if: steps.gate.outputs.enabled == 'true'
        run: |
          poetry run python main.py --mode tournament
        env:
          # Only the secrets the bot uses (see NOTES.md). No paid services.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Official data for numeric questions (hard_data.py; FRED is free).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Free Google AI Studio key (no billing), for the gemini-free lineup.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Writes the Gemini daily quota ledger to the private fall26-data repo.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          # Only used to open an issue when the spending tier changes.
          GITHUB_TOKEN: ${{ github.token }}
      # Tell healthchecks.io the bot is alive (/fail if this run failed). If
      # no ping arrives for a while, healthchecks.io emails Tony.
      # The daily health check (architect, 29 Sep): the first run after 06:00
      # UTC starts health.yml if it hasn't run yet that UTC day. After the
      # forecast, never fails the job.
      - name: Start the daily health check if due
        if: always() && steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: poetry run python health_dispatch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ping healthchecks.io
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then echo "HEALTHCHECK_URL not set"; exit 0; fi
          suffix=""
          if [ "$JOB_STATUS" != "success" ]; then suffix="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "${HEALTHCHECK_URL%/}$suffix" \
            && echo "Pinged healthchecks.io${suffix:+ (fail)}" \
            || echo "::warning title=healthcheck-ping-failed::Could not ping healthchecks.io"
