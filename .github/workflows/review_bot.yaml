name: Review recent forecasts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for resolved questions"
        default: "30"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday morning

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Scores how the bot's resolved forecasts turned out. Read-only: it makes no
# forecasts, spends nothing on LLMs, and publishes nothing.
# The weekly run is off by default: it needs both repository variables
# REVIEW_BOT_ENABLED and BOT_ENABLED set to true. Running it by hand always works.
permissions:
  contents: read

jobs:
  review_job:
    if: (vars.REVIEW_BOT_ENABLED == 'true' && vars.BOT_ENABLED == 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # bot-review pins forecasting-tools <0.3, so it gets its own isolated
      # install via pipx instead of sharing the bot's poetry environment.
      - name: Review forecasts
        run: |
          pipx run --spec "metaculus-bot-review>=0.1.1,<0.2" bot-review review \
            --resolved-since ${{ inputs.days || 30 }} \
            --output review.json \
            --summary review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Show the summary in the run page
        run: cat review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the review
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: |
            review.json
            review.md
          retention-days: 90
