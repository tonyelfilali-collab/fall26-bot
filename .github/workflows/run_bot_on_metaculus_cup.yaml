name: Forecast on Metaculus Cup

# Manual only: the automatic schedule was removed. Run it from the Actions tab.
on:
  workflow_dispatch:

# Shared with every workflow that forecasts, so they never run at the same time.
concurrency:
  group: forecast-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # These are real questions, so the same master switch applies.
      - name: Check BOT_ENABLED
        id: gate
        env:
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
        run: |
          if [ "$BOT_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "BOT_ENABLED is not true, exiting"
            echo "BOT_ENABLED is not true, exiting" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.11"
      - name: Install poetry
        if: steps.gate.outputs.enabled == 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: poetry install --no-interaction --no-root
      - name: Run bot
        if: steps.gate.outputs.enabled == 'true'
        run: |
          poetry run python main.py --mode metaculus_cup
        env:
          # Only the secrets the bot uses (see NOTES.md). No paid services.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Free Google AI Studio key (no billing), for the gemini-free lineup.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Writes the Gemini daily quota ledger to the private fall26-data repo.
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
