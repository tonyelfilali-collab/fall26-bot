name: Unit tests

# Runs the tests in tests/ on every pull request. They use a local dummy
# server, so they make no real model calls and need no secrets.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run tests
        run: poetry run pytest -q
