name: Replay lab

# Test-only: re-runs variant configurations on the frozen dossiers of RESOLVED
# live questions and scores them against the live forecast (lab.py). Never
# submits. Its own queue, never the live one, so it never delays or cancels a
# live run; so no Gemini (no Gemini key). Nemotron (:free) at most 300 calls a
# day. Ends by minute 8 (lab.py checks the time before every call; the job
# timeout is only a backstop). Started once a day by the tournament run
# (health_dispatch.py), or by hand. `synthetic`: an end-to-end run on a
# synthetic resolved question (no real calls).
on:
  workflow_dispatch:
    inputs:
      synthetic:
        description: "End-to-end run on a synthetic resolved question (recorded replies, no real calls)"
        type: boolean
        default: false

# Its own queue: it never waits in, or holds up, the live "forecast-bot" queue.
concurrency:
  group: replay-lab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run the replay lab
        run: |
          if [ "$SYNTHETIC" = "true" ]; then
            poetry run python lab.py --synthetic
          else
            poetry run python lab.py
          fi
        env:
          SYNTHETIC: ${{ inputs.synthetic }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
